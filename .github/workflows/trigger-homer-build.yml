name: Trigger Homer image rebuild

# Every push to homer-patches should rebuild the homer image so anjorin's
# container picks up fresh nanobot code. deploy-homer.yml (direct-install
# /opt/homer/.venv) covers the non-container path; this dispatch covers
# the containerised tenants path via homer@main's build-hosted-image.yml,
# which cache-busts the nanobot pip install on every homer-patches SHA.
on:
  push:
    branches: [homer-patches]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Fire repository_dispatch at anjorinjnr/homer
        uses: peter-evans/repository-dispatch@v3
        with:
          # HOMER_REPO_PAT is a fine-grained PAT with `Actions: write`
          # on anjorinjnr/homer. GITHUB_TOKEN can't reach another repo.
          token: ${{ secrets.HOMER_REPO_PAT }}
          repository: anjorinjnr/homer
          event-type: nanobot-patches-updated
          client-payload: |
            {
              "nanobot_sha": "${{ github.sha }}",
              "nanobot_ref": "${{ github.ref_name }}"
            }
